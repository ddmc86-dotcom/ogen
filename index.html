<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="מרחב העבודה של רכז הבוגרים באורט אמירים: מה עושים החודש, עם מי, ואיפה החומרים.">
<meta name="theme-color" content="#1d3b4f">
<title>עוגן – רכז בוגרים אמירים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* כיוון: יומן עבודה נקי של רכז – כחול-ים עמוק כעוגן, הדגשה בצבע חבל/זעפרן, נייר בהיר. פריסה: פס עליון + ניווט לשוניות + תוכן ברוחב קריא */
:root{
  --bg:#f4f2ec; --surface:#ffffff; --ink:#1b2a33; --muted:#5b6870;
  --brand:#1d3b4f; --accent:#b8740a; --line:#dcd8cc; --soft:#e9eef1;
  --ok:#2f7a4f; --warn:#a15c00;
  --display:"Frank Ruhl Libre", "David Libre", Georgia, serif;
  --body:"Assistant", "Noto Sans Hebrew", "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a1f; --surface:#1a252c; --ink:#e7ecee; --muted:#a3b0b7;
    --brand:#8fc0dc; --accent:#f0b24a; --line:#2c3a43; --soft:#22313a;
    --ok:#6cc495; --warn:#f0b24a; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a1f; --surface:#1a252c; --ink:#e7ecee; --muted:#a3b0b7;
  --brand:#8fc0dc; --accent:#f0b24a; --line:#2c3a43; --soft:#22313a;
  --ok:#6cc495; --warn:#f0b24a; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
header.top{background:var(--brand);color:#fff;padding:20px 16px 0}
:root[data-theme="dark"] header.top{background:#0d2230}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#0d2230}}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}
header .wrap{padding-inline:0}
.brandline{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.school-logo{background:#fff;border-radius:10px;padding:6px 10px;display:inline-flex;line-height:0}
.school-logo img{height:60px;width:auto;display:block}
@media (max-width:480px){.school-logo img{height:48px}}
h1{font-family:var(--display);font-size:clamp(28px,5vw,40px);margin:0;line-height:1.2;text-wrap:balance}
.sub{opacity:.88;font-size:16px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:16px;scrollbar-width:none}
nav.tabs a{color:#fff;text-decoration:none;padding:10px 14px;min-height:44px;display:flex;align-items:center;border-radius:8px 8px 0 0;white-space:nowrap;font-weight:600;opacity:.8}
nav.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink);opacity:1}
main{padding:24px 0 56px}
h2{font-family:var(--display);font-size:28px;margin:0 0 6px;line-height:1.25;text-wrap:balance}
h3{font-size:19px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 20px;max-width:65ch}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-inline-start:6px solid var(--accent);border-radius:8px;padding:14px 16px;margin-bottom:20px}
.alert strong{color:var(--warn)}
.months{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.months button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer;white-space:nowrap}
.months button[aria-pressed="true"]{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.months button .now{font-size:13px;color:var(--accent);font-weight:700}
.months button[aria-pressed="true"] .now{color:inherit}
.progress{display:flex;align-items:center;gap:12px;margin:4px 0 18px;color:var(--muted);font-size:15px}
.bar{flex:1;max-width:320px;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.group{margin-bottom:22px}
.group > .label{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-bottom:8px}
ul.tasks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.task input{width:24px;height:24px;margin:3px 0 0;accent-color:var(--ok);cursor:pointer}
.task label{font-weight:600;cursor:pointer}
.task.done label{text-decoration:line-through;color:var(--muted)}
.task .meta{grid-column:2;font-size:15px;color:var(--muted)}
.task .meta b{color:var(--ink);font-weight:600}
.links{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;text-decoration:none;background:var(--soft);color:var(--brand);min-height:32px}
.chip svg{width:14px;height:14px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.card p{margin:4px 0;font-size:16px}
.card .k{font-size:14px;font-weight:700;color:var(--muted)}
table{border-collapse:collapse;width:100%;background:var(--surface);font-size:16px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{background:var(--soft);font-size:15px}
.freq{font-weight:700;color:var(--brand);white-space:nowrap}
.status{display:flex;gap:4px;flex-wrap:wrap}
.status button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 10px;min-height:40px;cursor:pointer}
.status button[aria-pressed="true"][data-v="0"]{background:var(--soft);font-weight:700}
.status button[aria-pressed="true"][data-v="1"]{background:var(--warn);color:#fff;border-color:var(--warn)}
.status button[aria-pressed="true"][data-v="2"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.save{font-size:14px;color:var(--muted);margin-top:28px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:14px;padding:18px 0 28px}
.drive-note{margin:0 0 10px;text-align:center}
.foot{display:flex;flex-direction:column;align-items:center;gap:8px}
.foot a{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;color:inherit;text-decoration:none;padding:8px 12px;border-radius:999px;min-height:44px}
.foot a:hover{background:var(--soft)}
.foot img{border-radius:50%;flex:none}
.foot .studio{font-family:var(--display);color:var(--ink);font-weight:700}
@media (prefers-reduced-motion: no-preference){.bar i{transition:width .3s ease}}
@media (max-width:480px){body{font-size:16px} .task{padding:12px}}
</style>
</head>

 ["קהילת הרכזים ומנהל האזור","ברשת אורט","פורום חודשי; ישיבות סטטוס באמצע השנה ובסופה.","למידה מעמיתים, ניוזלטר, רעיונות."],

 ["יתד / ניצוץ (רווחה)","ביישוב","לפי הצורך.","עו״ס לצעירים במצבי קושי."],
 ["נבחרת יב׳","מהתלמידים","מפגש לפי הערכות (5 בשנה).","הפצת סקרים בכיתות, מיזמים, ייצוג השכבה."],
 ["המנטורים","מהבוגרים","הצמדה מינואר.","ליווי תלמידים ובוגרים צעירים, פאנלים."]

var S = window.__STATE || {done:{},goals:{},t:0};
try{ var ls = JSON.parse(localStorage.getItem("ogen-state")||"null"); if(ls && ls.t > (S.t||0)) S = ls; }catch(e){}

var app = document.getElementById("app");
var ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>';
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function chips(keys){ if(!keys||!keys.length) return ""; return '<div class="links">'+keys.map(function(k){var l=L[k];return '<a class="chip" href="'+l[1]+'" target="_blank" rel="noopener">'+ICON+esc(l[0])+'</a>';}).join("")+'</div>'; }
function schoolMonth(){ var m = new Date().getMonth(); return (m+4)%12; }
var sel = schoolMonth();

var artifactNS = null, pending = null;
if(window.claude && claude.use){ claude.use("artifact").then(function(a){ artifactNS = a; }).catch(function(){}); }
function persist(){
  S.t = Date.now();
  try{ localStorage.setItem("ogen-state", JSON.stringify(S)); }catch(e){}
  clearTimeout(pending);
  pending = setTimeout(function(){
    if(!artifactNS) return;
    var html = TEMPLATE.replace(/\/\*@@STATE\*\/[\s\S]*?\/\*@@END\*\//, '/*@@STATE*/window.__STATE = '+JSON.stringify(S).replace(/</g,"\\u003c")+';/*@@END*/');
    artifactNS.publish(html).catch(function(){});
  }, 1500);
}

function viewNow(){
  var tasks = T[sel], all = tasks.length + R.length, n = 0;
  tasks.forEach(function(t){ if(S.done[t[0]]) n++; });
  R.forEach(function(r,i){ if(S.done["r"+sel+"-"+i]) n++; });
  var cur = schoolMonth();
  var h = '<h2>מה עושים ב'+M[sel]+'</h2><p class="lead">סמן כל משימה שבוצעה. ליד כל משימה כתוב עם מי עובדים עליה וכיצד, ויש קישור לחומר המתאים.</p>';
  if(cur<=2) h += '<div class="alert"><div><strong>דחוף:</strong> התכנית השנתית צריכה להיות מאושרת אצל המנהל עד 30.11, כולל מועדי הסקרים והיעדים המספריים.</div></div>';
  h += '<div class="months" role="group" aria-label="בחירת חודש">'+M.map(function(m,i){return '<button type="button" data-m="'+i+'" aria-pressed="'+(i===sel)+'">'+m+(i===cur?' <span class="now">· עכשיו</span>':'')+'</button>';}).join("")+'</div>';
  var pct = Math.round(n/all*100);
  h += '<div class="progress"><span>'+n+' מתוך '+all+' בוצעו</span><span class="bar"><i style="width:'+pct+'%"></i></span></div>';
  h += '<div class="group"><div class="label">משימות החודש</div><ul class="tasks">'+tasks.map(function(t){
    var d=!!S.done[t[0]];
    return '<li class="task'+(d?' done':'')+'"><input type="checkbox" id="t-'+t[0]+'" data-id="'+t[0]+'"'+(d?' checked':'')+'><label for="t-'+t[0]+'">'+esc(t[1])+'</label><div class="meta"><b>עם מי:</b> '+esc(t[2])+(t[3]?' · '+esc(t[3]):'')+'</div>'+chips(t[4])+'</li>';
  }).join("")+'</ul></div>';
  h += '<div class="group"><div class="label">שגרה של כל חודש</div><ul class="tasks">'+R.map(function(r,i){
    var id="r"+sel+"-"+i, d=!!S.done[id];
    return '<li class="task'+(d?' done':'')+'"><input type="checkbox" id="t-'+id+'" data-id="'+id+'"'+(d?' checked':'')+'><label for="t-'+id+'">'+esc(r)+'</label></li>';
  }).join("")+'</ul></div>';
  return h;
}
function viewRoutines(){
  var rows=[["כל שבוע","זום עם 2 המלגאים (הנחיה, מעקב אחר הבוגרים, התלבטויות)"],["כל שבוע","קשר עם המורים המלווים ב״תמיד איתך״"],["כל 3 שבועות","כל מלגאי מגיע לבית הספר"],["כל חודש","פגישה עם המנהל"],["כל חודש","פגישה עם מלווה ארגון הבוגרים"],["כל חודש","פורום / השתלמות רכזים"],["כל חודש","סנכרון עם מוביל יב׳, הרכז החברתי ורכז הכנה לצה״ל"],["כל חודש","עדכון בקבוצה השקטה + ברכת ראש חודש"],["כל חודש","קבלת דוח חודשי מכל מלגאי"],["כל חודשיים","פילוח נתונים במערכת קשרי קהילה"],["כל רבעון","מפגש צוות היגוי בית־ספרי"],["כל רבעון","מפגש עם מרכז הצעירים / יתד"],["אמצע השנה","ישיבת סטטוס: מנהל, מלווה אורט, מנהל האזור"],["סוף השנה","ישיבת סיכום והיערכות לשנה הבאה"]];
  return '<h2>שגרות קבועות</h2><p class="lead">אלה הדברים שחוזרים כל הזמן. כדאי להכניס אותם ליומן פעם אחת כאירועים חוזרים, וכך לא צריך לזכור אותם.</p><div class="tablewrap"><table><thead><tr><th>מתי</th><th>מה</th></tr></thead><tbody>'+rows.map(function(r){return '<tr><td class="freq">'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join("")+'</tbody></table></div>';
}
function viewPeople(){
  return '<h2>עם מי עובדים</h2><p class="lead">רכז הבוגרים לא עובד לבד. העבודה שלו היא לחבר בין האנשים האלה, והוא לא נכנס לתחום של אף אחד מהם.</p><div class="grid">'+P.map(function(p){return '<div class="card"><div class="k">'+p[1]+'</div><h3>'+p[0]+'</h3><p><b>מתי:</b> '+p[2]+'</p><p><b>מה מבקשים:</b> '+p[3]+'</p></div>';}).join("")+'</div>';
}
function viewScholars(){
  return '<h2>המלגאים (2)</h2><p class="lead">סטודנטים בוגרי בית הספר שמלווים את הבוגרים הצעירים בקשר אישי. הרכז מנחה אותם ואחראי עליהם.</p>'+
  '<div class="grid">'+
  '<div class="card"><h3>המסגרת</h3><p>140 שעות התנדבות בשנה לכל מלגאי: 120 בבית הספר ו־20 במרכז הצעירים או ביוזמות של קרן ברק.</p><p>זום שבועי עם הרכז, והגעה לבית הספר לפחות פעם בשלושה שבועות.</p></div>'+
  '<div class="card"><h3>מה המלגאי עושה</h3><p>שומר על קשר קבוע (טלפון/וואטסאפ) עם רשימת הבוגרים שקיבל מהרכז, בודק מה הם צריכים ומחבר אותם לזכויות ולשירותים.</p><p>עוזר בהפצת הסקרים, באירועים ובפאנלים, ומוביל מיזם חברתי.</p></div>'+
  '<div class="card"><h3>מה הרכז עושה</h3><p>מגייס, מקיים התנעה, מחלק רשימות, מנחה בזום, עוקב אחר הדיווחים ומטפל בהפניות במצבי קיצון.</p></div>'+
  '<div class="card" style="border-inline-start:6px solid var(--accent)"><h3>סימני מצוקה</h3><p>מלגאי שמזהה סימן מצוקה מדווח לרכז <b>מיד</b>. הרכז מפנה לגורם המקצועי (יועצת, יתד, מרכז הצעירים, ארגון הבוגרים) ולא משאיר את זה אצל המלגאי.</p></div>'+
  '<div class="card"><h3>טפסים</h3><p>אחרי ההתנעה: ״יוצאים לדרך״. כל חודש: דוח פעילות. בסוף השנה: דוח שעות חתום.</p>'+chips(["kick","hours"])+'</div>'+
  '<div class="card"><h3>להכרות</h3>'+chips(["splan","sdeck","svid"])+'</div>'+
  '</div>';
}
function viewToolkit(){
  return '<h2>ארגז כלים</h2><p class="lead">כל החומרים מהתיקייה המשותפת, מסודרים לפי מה שצריך לעשות.</p><div class="grid">'+K.map(function(k){return '<div class="card"><h3>'+k[0]+'</h3>'+chips(k[1])+'</div>';}).join("")+'</div>';
}
function viewGoals(){
  var labels=["טרם החל","בביצוע","הושלם"], done=0;
  G.forEach(function(g,i){ if((S.goals[i]||0)===2) done++; });
  return '<h2>מעקב יעדים</h2><p class="lead">היעדים של מסלול ממשיכים. כדאי לעדכן לפני כל פגישה עם המנהל.</p><div class="progress"><span>'+done+' מתוך '+G.length+' הושלמו</span><span class="bar"><i style="width:'+Math.round(done/G.length*100)+'%"></i></span></div><div class="tablewrap"><table><thead><tr><th>תחום</th><th>מדד</th><th>יעד</th><th>סטטוס</th></tr></thead><tbody>'+G.map(function(g,i){var v=S.goals[i]||0;return '<tr><td>'+g[0]+'</td><td>'+g[1]+'</td><td>'+g[2]+'</td><td><div class="status" role="group" aria-label="סטטוס: '+esc(g[1])+'">'+labels.map(function(l,j){return '<button type="button" data-g="'+i+'" data-v="'+j+'" aria-pressed="'+(v===j)+'">'+l+'</button>';}).join("")+'</div></td></tr>';}).join("")+'</tbody></table></div>';
}
var VIEWS={now:viewNow,routines:viewRoutines,people:viewPeople,scholars:viewScholars,toolkit:viewToolkit,goals:viewGoals};
function render(){
  var v=(location.hash||"#now").slice(1); if(!VIEWS[v]) v="now";
  document.querySelectorAll("#tabs a").forEach(function(a){ if(a.getAttribute("href")==="#"+v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  app.innerHTML = VIEWS[v]() + '<p class="save">הסימונים נשמרים אוטומטית.</p>';
  var titles={now:"מה עושים החודש",routines:"שגרות קבועות",people:"עם מי עובדים",scholars:"המלגאים",toolkit:"ארגז כלים",goals:"מעקב יעדים"};
  document.title = titles[v]+" – עוגן";
}
app.addEventListener("change",function(e){ var id=e.target.getAttribute("data-id"); if(!id) return; if(e.target.checked) S.done[id]=1; else delete S.done[id]; persist(); render(); });
app.addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return;
  if(b.hasAttribute("data-m")){ sel=+b.getAttribute("data-m"); render(); return; }
  if(b.hasAttribute("data-g")){ S.goals[b.getAttribute("data-g")]=+b.getAttribute("data-v"); persist(); render(); }
});
window.addEventListener("hashchange",render);
render();
})();
